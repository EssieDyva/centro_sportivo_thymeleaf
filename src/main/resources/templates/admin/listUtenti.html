<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<title>Gestione Utenti</title>
</head>
<body>
	<nav th:insert="~{fragments/navigation :: block-navigation('Gestione Utenti')}"></nav>

	<div align="center" class="container  mt-3">
	
		<div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
  			<span th:text="${errorMsg}">*</span>
  			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Chiudi"></button>
		</div>
	
		<div class="card-header d-flex justify-content-between align-items-center w-75">
            <div>
                <p class="mb-0">Elenco utenti</p>
            </div>
        </div>
	
		<table class="table table-secondary w-75 mt-2">
			<thead>
				<tr align="center">
					<th>Username</th>
					<th>Email</th>
					<th>Ruolo</th>
					<th>Azioni</th>
				</tr>
			</thead>
			<tbody>
				<!-- th:attr elenco dei attributi da passare al javascript -->
				<tr th:each="utente : ${utenti}"
	    				class="clickable-row"
	    				th:attr="data-username=${utente.userName}, data-email=${utente.email}, data-role=${utente.role}"
	    				style="cursor: pointer;">
	    			<td th:text="${utente.userName}" align="center"></td>
	    			<td th:text="${utente.email}" align="center"></td>
	    			<td th:text="${utente.role}" align="center"></td>
	    			<td align="center">
	    				<a href="#" class="btn btn-sm btn-danger delete-btn"
	    					th:attr="data-username=${utente.userName}"
	    					onclick="return confirm('Sei sicuro di voler rimuovere questo utente?');">
	    					Cancella
	    				</a>
	    			</td>
				</tr>
			</tbody>
		</table>
	</div>

	<!-- Script di gestione dei bottoni di cancellazione -->
	<script>
	document.addEventListener("DOMContentLoaded", function () {
	    const deleteButtons = document.querySelectorAll(".delete-btn");
	    deleteButtons.forEach(btn => {
	      btn.addEventListener("click", function(e) {
	        e.preventDefault();
	        const username = this.getAttribute("data-username");
	        window.location.href = `/admin/removeUtente?username=${username}`;
	      });
	    });
	});
	</script>

</body>
</html>
